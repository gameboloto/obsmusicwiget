<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Radio Widget</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: transparent; /* Важно: фон должен быть прозрачным для OBS */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #art-container {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            background-color: rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.3);
        }

        #art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #text-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0; /* Чтобы длинные названия обрезались с ... */
        }

        #title {
            font-size: 1.4em;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        #artist {
            font-size: 1em;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #status {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="art-container">
        <!-- Сюда будет подставляться картинка -->
        <img id="art-img" src="" alt="Art" style="display:none;">
    </div>
    <div id="text-container">
        <div id="title">Загрузка...</div>
        <div id="artist"></div>
        <div id="status">Подключение к радио...</div>
    </div>

    <script>
        // URL сайта, который парсим
        const RADIO_URL = "https://radio.octowow.st/public/booty_bay_pirate_radio";
        
        // Интервал обновления (в миллисекундах). 5000 = 5 секунд.
        const UPDATE_INTERVAL = 5000;

        // Элементы страницы
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const statusEl = document.getElementById('status');
        const artImg = document.getElementById('art-img');

        // Функция для получения данных
        async function fetchTrackInfo() {
            try {
                statusEl.textContent = "Обновление...";
                
                // Делаем запрос к сайту радио
                const response = await fetch(RADIO_URL);
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }

                // Получаем HTML как текст
                const htmlText = await response.text();
                
                // Парсим HTML с помощью DOMParser (работает прямо в браузере)
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                // Извлекаем данные по классам
                const titleElement = doc.querySelector('.now-playing-title');
                const artistElement = doc.querySelector('.now-playing-artist');
                const artElement = doc.querySelector('.now-playing-art');

                // Обновляем название
                if (titleElement && titleElement.textContent.trim() !== "") {
                    titleEl.textContent = titleElement.textContent.trim();
                } else {
                    titleEl.textContent = "Неизвестный трек";
                }

                // Обновляем артиста
                if (artistElement && artistElement.textContent.trim() !== "") {
                    artistEl.textContent = artistElement.textContent.trim();
                } else {
                    artistEl.textContent = "";
                }

                // Пытаемся найти картинку арта внутри .now-playing-art
                if (artElement) {
                    const imgInArt = artElement.querySelector('img');
                    if (imgInArt && imgInArt.src) {
                        artImg.src = imgInArt.src;
                        artImg.style.display = 'block';
                    } else {
                        // Если картинка задана через background-image в style
                        const bgUrl = artElement.style.backgroundImage;
                        if (bgUrl && bgUrl !== 'none') {
                            // Извлекаем URL из строки вида url("...")
                            const match = bgUrl.match(/url\(['"]?(.*?)['"]?\)/);
                            if (match && match[1]) {
                                artImg.src = match[1];
                                artImg.style.display = 'block';
                            } else {
                                artImg.style.display = 'none';
                            }
                        } else {
                            artImg.style.display = 'none';
                        }
                    }
                }

                statusEl.textContent = "Обновлено";
                
                // Прячем статус через 2 секунды после успешного обновления
                setTimeout(() => { statusEl.textContent = ""; }, 2000);

            } catch (error) {
                console.error("Ошибка парсинга:", error);
                statusEl.textContent = "Ошибка загрузки данных";
                titleEl.textContent = "—";
                artistEl.textContent = "";
            }
        }

        // Запускаем сразу и затем повторяем каждые N секунд
        fetchTrackInfo();
        setInterval(fetchTrackInfo, UPDATE_INTERVAL);
    </script>
</body>
</html>
